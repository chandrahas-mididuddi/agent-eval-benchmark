[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-benchmark"
version = "0.1.0"
description = "A reproducible evaluation benchmark for agentic AI workflows: task success, tool-call accuracy, token cost, and latency."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Chandrahas Mididuddi"}]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.scripts]
agent-eval = "agent_eval_benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["agent_eval_benchmark*"]
